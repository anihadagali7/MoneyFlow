name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is written by npm 11; npm 10 (bundled with Node 22) reads it differently.
      - run: npm install -g npm@11
      - run: npm ci
      # Route types (PageProps<"/...">) are generated, not committed.
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      # Tests use an in-memory Postgres (PGlite) and fake keys: no secrets needed.
      - run: npm test
