name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same Node as Vercel (package.json "engines") and local dev (nvm use).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Route types (PageProps<"/...">) are generated, not committed.
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      # Tests use an in-memory Postgres (PGlite) and fake keys: no secrets needed.
      - run: npm test
